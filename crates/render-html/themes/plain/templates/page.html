{% extends "base.html" %}
{%- block content %}
{%- if page.toc %}
<details class="page-toc">
<summary>On this page</summary>
<ul>
{%- for item in page.toc recursive %}
<li><a href="#{{ item.id }}">{{ item.title }}</a>
{%- if item.children %}
<ul>{{ loop(item.children) }}
</ul>
{%- endif %}</li>
{%- endfor %}
</ul>
</details>
{%- endif %}
{{ content }}
{%- endblock %}
